name: Process Video Pipeline

on:
  repository_dispatch:
    types: [process-video]

jobs:
  process-video:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    services:
      bgutil-pot:
        image: brainicism/bgutil-ytdlp-pot-provider:latest
        ports:
          - 4416:4416

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: remotion/package.json

      - name: Install System Dependencies (FFmpeg & Headless Libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb fonts-liberation libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2 libxss1 || true

      - name: Setup Cloudflare WARP Network (Anti-Datacenter Bypass)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-warp.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode proxy || warp-cli --accept-tos set-mode proxy || true
          warp-cli --accept-tos proxy port 40000 || warp-cli --accept-tos set-proxy-port 40000 || true
          warp-cli --accept-tos connect || true
          sleep 4
          curl -x socks5://127.0.0.1:40000 -s https://cloudflare.com/cdn-cgi/trace || true

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -U "yt-dlp[default]" yt-dlp-ejs youtube-transcript-api huggingface_hub requests cryptography playwright bgutil-ytdlp-pot-provider

      - name: Install Playwright Browsers (for Anti-Bot Stealth)
        run: |
          playwright install chromium || true

      - name: Install Remotion Dependencies
        run: |
          cd remotion
          npm install

      - name: Wait for PO Token Provider Service
        run: |
          echo "Waiting for bgutil-pot service on port 4416..."
          for i in {1..15}; do
            curl -s http://127.0.0.1:4416/ && echo "Service is up!" && break || sleep 2;
          done

      - name: Execute Main Pipeline
        env:
          PYTHONPATH: .
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO_ID: ${{ secrets.HF_DATASET_REPO_ID }}
          HF_KEYS_DATASET_REPO_ID: ${{ secrets.HF_KEYS_DATASET_REPO_ID }}
          MASTER_ENCRYPTION_KEY: ${{ secrets.MASTER_ENCRYPTION_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Cookie and API Keys from payload are securely read by Python from $GITHUB_EVENT_PATH
          mkdir -p work
          python pipeline/main.py \
            --job_id "${{ github.event.client_payload.job_id }}" \
            --user_id "${{ github.event.client_payload.user_id }}" \
            --youtube_url "${{ github.event.client_payload.youtube_url }}" \
            --duration_mode "${{ github.event.client_payload.duration_mode || 'standard_30_60' }}" \
            --clip_count "${{ github.event.client_payload.clip_count || 3 }}" \
            --crop_mode "${{ github.event.client_payload.crop_mode || 'blurred_stack' }}" \
            --caption_style "${{ github.event.client_payload.caption_style || 'bold_yellow' }}"

      # FAILURE TRAP: Mengunggah status error ke HF Dataset jika runner crash
      - name: System Failure Trap
        if: failure()
        env:
          PYTHONPATH: .
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO_ID: ${{ secrets.HF_DATASET_REPO_ID }}
        run: |
          if [ -f "work/.error_handled" ]; then
            echo "Error already handled by main.py. Skipping generic failure trap."
            exit 0
          fi
          python pipeline/status.py \
            --job_id "${{ github.event.client_payload.job_id }}" \
            --user_id "${{ github.event.client_payload.user_id }}" \
            --status "error" \
            --message "Runner GitHub Actions mengalami kegagalan sistem pada runner." \
            --error "GitHub Actions Runner Failure"
